name: Build and Push Docker Image

# Triggers ONLY after "Model Evaluation" finishes
on:
  workflow_run:
    workflows: ["Model Evaluation"]
    types:
      - completed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Run only if the previous workflow (Evaluation) was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v3

      # 1. Login to Docker Hub using GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Set up Docker Buildx (required for building)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Build the image and Push it to your repository
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Your specific Docker Hub tag
          tags: dockerjeremieo1/sentiment-app:latest